            - paragraph [ref=f7e219]: 손잡이를 끌어 탐색 화면에 보이는 차례를 바꿉니다. 숨긴 분야는 탐색 사이드바에서만 빠지고, 디자이너는 계속 고를 수 있으며 프로필에도 나옵니다. 의뢰 범위가 ‘고객이 선택’인 분야만 탐색 제목 옆에 ‘전체 | 디자인 | 디자인 + 개발’ 필터가 나옵니다. 시작가를 비워 두면 디자이너마다 정한 가격(디자인 전체·프로젝트 최소가, 프리미엄은 디자이너별 프리미엄 금액)이 나갑니다. 프리미엄은 설정의 유형별 프리미엄과 디자이너별 프리미엄이 함께 켜져 있어야 나가고, 여기서 끄면 그 분야·범위에서만 빠집니다. ‘메인시안 우선 허용’을 켠 분야를 고른 디자이너만 메인시안 의뢰를 받을 수 있습니다. 쓰는 디자이너가 있는 분야는 숨긴 뒤에 지울 수 있고, 지우면 그 디자이너들에게서도 빠집니다.
